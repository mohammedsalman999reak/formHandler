name = "form-handler-worker"
main = "src/index.js"
compatibility_date = "2024-01-15"

# Worker configuration
[build]
command = ""

# Environment variables (default, can be overridden by specific env)
[vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "form-handler-prod"
compatibility_date = "2024-01-15"

[env.production.vars]
ENVIRONMENT = "production"
AIRTABLE_API_KEY = "YOUR_AIRTABLE_API_KEY"
AIRTABLE_BASE_ID = "YOUR_AIRTABLE_BASE_ID"
AIRTABLE_TABLE_NAME = "Form Submissions"
RESEND_API_KEY = "YOUR_RESEND_API_KEY"
RESEND_FROM_EMAIL = "from@example.com"
RESEND_TO_EMAIL = "to@example.com"
ALLOWED_ORIGINS = "*"
API_SECRET_KEY = "YOUR_API_SECRET_KEY"
RATE_LIMIT_REQUESTS_PER_MINUTE = "60"
REQUIRED_FIELDS = "name,email,message"
TURNSTILE_SECRET_KEY = "YOUR_TURNSTILE_SECRET_KEY"

# Staging environment
[env.staging]
name = "form-handler-staging"
compatibility_date = "2024-01-15"

[env.staging.vars]
ENVIRONMENT = "staging"
# You can override any keys for staging if needed

# Development environment
[env.development]
name = "form-handler-dev"
compatibility_date = "2024-01-15"

[env.development.vars]
ENVIRONMENT = "development"
AIRTABLE_API_KEY = "YOUR_AIRTABLE_API_KEY"
AIRTABLE_BASE_ID = "YOUR_AIRTABLE_BASE_ID"
AIRTABLE_TABLE_NAME = "Form Submissions"
RESEND_API_KEY = "YOUR_RESEND_API_KEY"
RESEND_FROM_EMAIL = "from@example.com"
RESEND_TO_EMAIL = "to@example.com"
ALLOWED_ORIGINS = "*"
API_SECRET_KEY = "YOUR_API_SECRET_KEY"
RATE_LIMIT_REQUESTS_PER_MINUTE = "60"
REQUIRED_FIELDS = "name,email,message"
TURNSTILE_SECRET_KEY = "YOUR_TURNSTILE_SECRET_KEY"

# Example empty KV namespace for development
[[env.development.kv_namespaces]]
# binding = "RATE_LIMITER"
# id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"
